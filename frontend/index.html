<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mafia21 — Frontend</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Mafia21</h1>
      <p class="subtitle">Дигитална демонстрация — фронтенд</p>
    </header>

    <main>
      <div id="log" class="log">Натисни "Старт" за да стартираш демото.</div>
      <div class="controls">
        <button id="startBtn">Старт</button>
        <button id="demoBtn">Демо ход</button>
      </div>

      <section id="game" class="game hidden">
        <h2>Играта е стартирана</h2>
        <div id="state"></div>
      </section>

      <noscript>
        <p style="color:#ffb4a2">JavaScript трябва да е разрешен, за да работи демото.</p>
      </noscript>

      <p id="fileNote" style="margin-top:12px;color:var(--muted);font-size:13px"></p>
    </main>

    <footer>
      <small>За пълната версия използвай оригиналните assets/файлове от архива.</small>
    </footer>
  </div>

  <!-- Заявка за зареждане на локален скрипт (относителен път): работи и при file:// -->
  <script src="js/index.js"></script>
</body>
</html>
