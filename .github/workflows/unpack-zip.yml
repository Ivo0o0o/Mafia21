name: Unpack Mafia21 zip

on:
  workflow_dispatch:
  push:
    branches:
      - extract-zip

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Ensure unzip is available
        run: sudo apt-get update && sudo apt-get install -y unzip || true

      - name: Unpack Mafia21_095337.zip to extracted/
        run: |
          if [ -f "Mafia21_095337.zip" ]; then
            mkdir -p extracted
            unzip -o Mafia21_095337.zip -d extracted || true
            echo "Unzipped Mafia21_095337.zip"
            ls -la extracted
          else
            echo "Mafia21_095337.zip not found"
            exit 0
          fi

      - name: Move files from extracted/ into repo root without overwriting existing files
        run: |
          shopt -s dotglob || true
          for f in extracted/*; do
            base=$(basename "$f")
            if [ -e "$base" ]; then
              echo "Skipping existing $base"
            else
              mv "$f" .
              echo "Moved $base"
            fi
          done
          ls -la

      - name: Commit and push extracted files using GITHUB_TOKEN
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Unpack Mafia21_095337.zip (automated)"
            git push origin HEAD:extract-zip
          fi
